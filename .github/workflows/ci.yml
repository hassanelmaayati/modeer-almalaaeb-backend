name: Backend tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PIPENV_DONT_LOAD_ENV: '1'
  PIPENV_VENV_IN_PROJECT: '1'
  MODEER_TEST_PG_BIN: /usr/lib/postgresql/16/bin

jobs:
  configuration:
    name: Backend gate policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify fail-closed gate without deploying
        run: python .github/scripts/ci_gate.py --self-test

  backend:
    name: Backend offline tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Pipfile.lock
      - name: Install PostgreSQL and PostGIS (network setup)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-16-postgis-3
      - name: Install locked Python dependencies (network setup)
        run: |
          python -m pip install pipenv==2024.0.1
          pipenv verify
          pipenv sync --dev
      - name: Offline backend tests with coverage
        run: pipenv run python -m tests.run_offline
      - name: Preserve backend coverage and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-${{ github.sha }}
          path: tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Backend production container build and offline startup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Pipfile.lock
      - name: Install PostgreSQL and PostGIS (network setup)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-16 postgresql-16-postgis-3
      - name: Install locked Python dependencies (network setup)
        run: |
          python -m pip install pipenv==2024.0.1
          pipenv verify
          pipenv sync --dev
      - name: Build the exact production Dockerfile (network setup)
        run: docker build --tag "modeer-backend-ci:$GITHUB_SHA" .
      - name: Start production container without external network
        run: pipenv run python .github/scripts/container_smoke.py --image "modeer-backend-ci:$GITHUB_SHA"

  gate:
    name: Backend CI
    if: always()
    needs: [configuration, backend, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every mandatory job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py --results "$CI_JOB_RESULTS" --required configuration backend container
